# Create wrangler.toml with proper TOML
$wranglerToml = @'
name = "upalit-backend"
main = "src/worker.js"
compatibility_date = "2024-01-01"

[vars]
NODE_ENV = "production"

[env.production]
vars = { NODE_ENV = "production" }

[env.preview]
vars = { NODE_ENV = "preview" }
'@

$wranglerToml | Out-File -FilePath wrangler.toml -Encoding utf8